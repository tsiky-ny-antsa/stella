spring.application.name=serveurmen2

spring.datasource.url=jdbc:sqlite:./data/serveurmen2.db?journal_mode=WAL&busy_timeout=5000&date_class=TEXT&date_string_format=yyyy-MM-dd HH:mm:ss.SSS
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP

server.address=0.0.0.0
server.port=8081

# Logs de debug (decommenter pour le debogage) :
#logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMapping=TRACE
#spring.jpa.show-sql=true
#logging.level.org.apache.coyote.http11=DEBUG

#app.api-key=2383928049090209

# CORS : origines autorisees pour les clients web (separees par des virgules, * = tout autoriser)
app.cors.allowed-origins=*

# --- Authentification JWT des clients ---
# CLE SECRETE : A CHANGER EN PRODUCTION (generer avec : openssl rand -base64 48)
# Si elle change, tous les tokens emis deviennent invalides (deconnexion generale).
app.jwt.secret=J0QYq5eu6E8SouuVbiUbNm7fCu41K9e7ImgRHwLyDkFYycjfJOqy/Kxyj6G0i39H
# Duree de vie d'un token apres login (en minutes ; 1440 = 24 h)
app.jwt.expiration-minutes=1440

# Compte ADMIN cree automatiquement au premier demarrage si aucun admin n'existe.
# A CHANGER EN PRODUCTION (ou creer vos admins via POST /api/users).
app.admin.username=admin
app.admin.password=admin123
app.admin.email=admin@serveurmen2.local

# --- Alimentation : bascule onduleur -> groupe electrogene ---
# Delai sans retour de la ligne fixe avant bascule vers la ligne de secours.
# 300 s = 5 min (phase actuelle raccourcie) ; mettre 2700 s = 45 min en production.
# L'ESP32 lit cette valeur via GET /api/esp32/{deviceId}/config : aucun reflashage necessaire.
app.alimentation.delai-bascule-secondes=300
# Intervalle d'envoi du niveau de carburant par l'ESP32 (seul le groupe electrogene a un reservoir)
app.alimentation.intervalle-carburant-secondes=300
# Seuil (en %) en dessous duquel l'ESP32 declenche une alerte CARBURANT_BAS
app.alimentation.seuil-alerte-carburant-pourcent=20
# Repetition d'une meme alerte non resolue par l'ESP32 (elle reste active jusqu'a auto-resolution serveur)
app.alimentation.intervalle-realerte-secondes=30